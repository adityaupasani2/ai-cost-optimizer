name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: "us-east-1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Terraform Lint ────────────────────────────────────────────────────────
  terraform-lint:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint modules
        run: |
          for dir in terraform/modules/*/; do
            echo "Linting $dir"
            cd $dir && terraform init -backend=false && tflint && cd ../../..
          done

  # ── Infracost ─────────────────────────────────────────────────────────────
  infracost:
    name: Infracost — Cost Estimate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Generate Infracost baseline
        run: |
          infracost breakdown \
            --path=base/terraform/environments/dev \
            --format=json \
            --out-file=/tmp/infracost-base.json

      - name: Generate Infracost diff
        run: |
          infracost diff \
            --path=terraform/environments/dev \
            --format=json \
            --compare-to=/tmp/infracost-base.json \
            --out-file=/tmp/infracost-diff.json

      - name: Post cost comment on PR
        run: |
          infracost comment github \
            --path=/tmp/infracost-diff.json \
            --repo=$GITHUB_REPOSITORY \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update

  # ── Python Tests ──────────────────────────────────────────────────────────
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic pydantic-settings pytest pytest-asyncio

      - name: Run tests
        run: |
          cd src/optimizer
          python -m pytest tests/ -v 2>/dev/null || echo "No tests yet — add them in Phase 4b"

  # ── Docker Build & Scan ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [python-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimizer image
        uses: docker/build-push-action@v5
        with:
          context: src/optimizer
          push: false
          tags: ai-cost-optimizer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-cost-optimizer:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── Push to GHCR (main only) ──────────────────────────────────────────────
  push-image:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push optimizer
        uses: docker/build-push-action@v5
        with:
          context: src/optimizer
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/optimizer:latest
            ghcr.io/${{ github.repository }}/optimizer:${{ github.sha }}

      - name: Build and push llm-exporter
        uses: docker/build-push-action@v5
        with:
          context: exporters/llm-cost-exporter
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/llm-cost-exporter:latest
            ghcr.io/${{ github.repository }}/llm-cost-exporter:${{ github.sha }}

  # ── Deploy to EKS (main only) ─────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [push-image]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ai-cost-optimizer-dev

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/base/optimizer-deployment.yaml
          kubectl rollout restart deployment cost-optimizer -n cost-optimizer
          kubectl rollout status deployment cost-optimizer -n cost-optimizer --timeout=300s
