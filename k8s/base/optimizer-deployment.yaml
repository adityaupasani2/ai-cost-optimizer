apiVersion: v1
kind: Namespace
metadata:
  name: cost-optimizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-optimizer
  namespace: cost-optimizer
  labels:
    app: cost-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-optimizer
  template:
    metadata:
      labels:
        app: cost-optimizer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      serviceAccountName: cost-optimizer
      containers:
        - name: cost-optimizer
          image: ghcr.io/adityaupasani2/ai-cost-optimizer/optimizer:latest
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cost-optimizer
  namespace: cost-optimizer
spec:
  selector:
    app: cost-optimizer
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-optimizer
  namespace: cost-optimizer
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::445876754940:role/ai-cost-optimizer-dev-cost-optimizer-irsa"
